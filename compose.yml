services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:450898ac410ed28a08020c68c22e591ce947fd74da13e9d0e36b257ffeda83fb
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
