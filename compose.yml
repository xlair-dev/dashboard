services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:87c6f2cee117381c285a3c833147028239d1b8737734023ebb3304c56a5f7805
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
