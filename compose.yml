services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:fab1e76b737c526e3e55eecc649e39b149e3865ebed2faccbdb942fd683931a6
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
