services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:d6b40cc7b2d63ff2952efe3da47d5e51135bfad18b08229a4a683cd9ee6e3d41
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
