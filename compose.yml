services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:93808c015dd886ba25fc56afee0627ff46885e872729b3b1ef872fc10ccb29e0
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
