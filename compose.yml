services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:12b56a8b42b1609ef52b33ca368b60ec6f0e13706832de638a8b7c06e8703420
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
