services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:1bdfddfbfdcffdcae80a488a003b91bb4030c05253bc922cc94fe270af3764b4
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
