services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:57e69b537e4324ccc8ab195d983ffb46a0250f8899a0b4d0d0ae24b804d6f14f
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
