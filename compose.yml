services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:144a36ceb92673f12a117aa7b77371d01e94c41934bec797574a734743c7d092
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
