services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:50901ae82764f4dba0e23a5e389efb691492c22f9ebfd3acf98cc9de4c37a981
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
