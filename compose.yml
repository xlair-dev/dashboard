services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:9b31a665f08ac3ce3ff2020489002b567d8060cd2fdcbd6bbea99cc1c2da84f2
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
