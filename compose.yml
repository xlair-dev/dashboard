services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:edac94c47ce269f9ebde96c9ad2994338558f7f6ee95ae196d01360494edcc40
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
