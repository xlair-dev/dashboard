services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:b47c86ce27f8f5fd71f0d6d8d5b0901aac1f77e513787c65c0b5161c34805c51
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
