services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:1155eb64add0081ede80fc88b61a83f8b357762f09ddd47a6f62f301b8cbabbc
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
