services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:21cd0c8dab00c52fe9ab58bb5e49b948979231a0592000be82d29a0abb6a9ac9
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
