services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:e51482c89cf1585aacc9057678e6f65b0d98809b5f68ce3c60b979ac722d171c
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
