services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:7e529e67c62b826d0465cc2f7bc69014cee8211e587f68a7141bd127ca4250eb
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
