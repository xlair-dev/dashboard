services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:79558b33a60cd821d07b2bcaaf1dcfcc7ebdc47eb433e80b53b6c6f04788ecb0
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
