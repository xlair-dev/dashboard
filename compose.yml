services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:99754d2949201985cafa3ed2bf866c63f13871aa7d553d5f0473603656cedef5
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
