services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:7217431cd6ab52615e4cd714e75277c774c82140cdd37e539cc113e795204719
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
