services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:762ef174b62a7c2ec2bc9c212477c1a353161555e43bf6b0ba7bbfdb091eacf7
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
