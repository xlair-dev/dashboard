services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:77be71133625f2189aa7c955ae2211f5b817655d4a1a16ccbd61691f05cbac13
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
