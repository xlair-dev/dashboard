services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:650a8946ffb1c7d20817695eff5e72e28190193f818520154ed3fe635ca0a683
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
