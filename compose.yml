services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:4bc0995237de9699178e63a2eabc3760ff6b080cb8ccaaed5f6ba8342efee224
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
