services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:1316e39db4867fe68c6367206cc4b3f9b938c462b4a1d4a665b807e89e16aad6
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
