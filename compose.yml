services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:54d985a5927e066b8fc23a9fe529069d89d0ffac9c5b85a4ced628f5062292fc
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
