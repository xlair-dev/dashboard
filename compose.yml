services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:8ecceef17716da0b801f5555b81a75e3d724e3c851c1db238bf1bd2976a8cca1
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
