services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:d221ad070564a6b015895da80f97e595ad6bdd1cd04815047aadf61f946944f5
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
