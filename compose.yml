services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:29f7a2dd7e56e98bb248ac29e4d4a564015b8eabaeabba14800604bc1deebee3
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
