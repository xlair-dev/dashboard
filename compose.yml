services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:d93ead7a3f52dfcfc4eda1cd2214fa2d286bcf8c5046ae193521804a74ade978
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
