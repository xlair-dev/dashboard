services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:b62eeb8df344b0a392fbeef1ed05cd63aa6ee9baf65d6d858ac5ecf86018c64f
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
