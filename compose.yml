services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:e440f712267e16208fdcfc49f4df65d9ef7464a015027c583a0666b367560da8
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
