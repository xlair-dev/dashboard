services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:c472d263a151df98fbbb7d547c692a9068d243caa0bc1fc69b3294c5ab1731c8
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
