services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:68fc7a89956e7c4b41e80ec7b6200803ddb02bf9e4ab9cdbcef09f276eb9e93f
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
