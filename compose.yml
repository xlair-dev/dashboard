services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:12e7cf981050545bf2e0af039063555d0c8c708c2b41b49414d5a1b31e95dc69
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
