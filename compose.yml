services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:d2a4953414cd981d7721358571466baba2a979dfea516f04c04c76dc519022ff
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
