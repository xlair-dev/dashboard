services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:8b5fb55050d17e7be825ca18940f10e7040727d92604a130c166555bcf529a8d
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
