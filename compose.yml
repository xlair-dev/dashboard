services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:cd77dcf67853c42318c1aff01c355b82801c25c571087709dba9131354609e55
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
