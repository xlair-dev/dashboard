services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:064a56e13427946e8ed0856caf424107ed6f84e646cc60dd03fc145a19acc953
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
