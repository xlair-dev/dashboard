services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:44989bfbda04cecc58d3c2fece80552223cba05e3f4bac0a802c3b504d5e342e
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
