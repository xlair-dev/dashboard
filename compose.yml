services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:15a10be9e081966555b425525acab57f73a34632a3dab6c26f9624a4ea7dcb47
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
