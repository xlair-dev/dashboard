services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:de38db08de9b045fede78bf5f8393292facfbee09ed359de01ab243f5a014fad
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
