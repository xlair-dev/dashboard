services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:f34c217e066be95b901d921573f049472c276d859fa7ffb2723dfbb7a8be9339
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
