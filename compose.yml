services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:0b03c7dff8b1979350568c2fb3c49c712739d67b90be797d24b27e80b8ea4c4a
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
