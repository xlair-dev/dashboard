services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:1c3af405606ddc0b9451927bf95561661dde52d96efafbb4473da27a40f01ec9
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
