services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:454bc0e5eb9a6f938a4c330fcd6b4d629163e372248cd36e75baa05d1b3b6f90
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
