services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:d286154a5dad757db69b95142f21ef94ca9f18dc9edd17aac93d1580e4990d71
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
