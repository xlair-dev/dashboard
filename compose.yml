services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:c24b232471393461034b638e8d90b961a4031066a37601b1002fc02bbaf131a5
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
