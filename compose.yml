services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:4fb33b0758560f7c1eb53b64f222c247486ee9b291e3c50c7dfd5c64de505096
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
