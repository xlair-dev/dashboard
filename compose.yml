services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:559d97efb1563082793f96b4223be0e36e11fb746222f4783b297b2de0897c67
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
