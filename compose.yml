services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:6427d3159d54c91b2c1aa46a2cc2808c26496c9a53527b71e41b9b8f950f5a92
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
