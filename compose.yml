services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:0a0b690bbebab5d3a4d8c0947a8db80bc2a08571614d7841c0be585543f2bcac
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
