services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:c82d75c26d67bec52a3087666bb5e8df5fad562daa85673a73a540501fb811bc
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
