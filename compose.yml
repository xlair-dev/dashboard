services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:1c8f2b3961b1cf33ad360b40a33bb0c25e4fe7be0e8863fb12aa6041ad9d40a1
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
