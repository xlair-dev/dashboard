services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:3874a07b47c851c0d6356907627f70afe747cded06dc17181af367ba6b18a700
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
