services:
  app:
    image: ghcr.io/xlair-dev/dashboard:latest@sha256:f6791dcc02d9af24b8693af819f4f3909c67af5d94628e04fd7293ca3fae9d26
    container_name: xlair-dashboard
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
